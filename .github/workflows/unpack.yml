
name: Extract project files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git pull --rebase origin main

      - name: Extract project ZIP
        run: |
          if [ ! -f "LinkPilotBrowser-android-build.zip" ]; then
            echo "ERROR: ZIP file not found!"
            ls -la
            exit 1
          fi

          unzip -o LinkPilotBrowser-android-build.zip
          cp -a LinkPilotBrowser/. .
          rm -rf LinkPilotBrowser
          rm -f LinkPilotBrowser-android-build.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract Android project files"
          fi

          git push origin main
