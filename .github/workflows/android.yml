
name: Build Mili Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Mili Browser source
        run: |
          unzip -q Mili-Browser-GeckoView-foundation.zip -d /tmp/mili-source
          rsync -a --exclude='.github/' /tmp/mili-source/LinkPilotBrowser/ ./

      - name: Fix legacy activity references
        run: |
          sed -i 's/this@MainActivity/this@LegacyMainActivity/g' app/src/main/java/com/linkpilot/browser/LegacyMainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Mili Browser
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mili-Browser-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
