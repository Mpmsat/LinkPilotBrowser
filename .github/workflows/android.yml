name: Build Mili Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and verify source archive
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "Mili-Browser-Source.zip" ]]; then
            SOURCE_ZIP="Mili-Browser-Source.zip"
          elif [[ -f "Mili-Browser-Full-Build-Kit.zip" ]]; then
            echo "Extracting source archive from the uploaded build kit..."
            unzip -p "Mili-Browser-Full-Build-Kit.zip" "Mili-Browser-Source.zip" > /tmp/Mili-Browser-Source.zip
            SOURCE_ZIP="/tmp/Mili-Browser-Source.zip"
          elif [[ -f "Mili-Browser-GeckoView-foundation.zip" ]]; then
            echo "Using the original GeckoView foundation archive..."
            SOURCE_ZIP="Mili-Browser-GeckoView-foundation.zip"
          else
            echo "ERROR: No recognized Mili source archive found in repository root."
            echo "Expected one of: Mili-Browser-Source.zip, Mili-Browser-Full-Build-Kit.zip, Mili-Browser-GeckoView-foundation.zip"
            ls -la
            exit 1
          fi

          echo "Using source archive: $SOURCE_ZIP"
          unzip -t "$SOURCE_ZIP"

          mkdir -p /tmp/mili-source
          unzip -q "$SOURCE_ZIP" -d /tmp/mili-source

          if [[ ! -f /tmp/mili-source/settings.gradle.kts ]]; then
            PROJECT_SETTINGS="$(find /tmp/mili-source -mindepth 2 -maxdepth 4 -name settings.gradle.kts -print -quit)"
            if [[ -n "$PROJECT_SETTINGS" ]]; then
              PROJECT_ROOT="$(dirname "$PROJECT_SETTINGS")"
            else
              echo "ERROR: settings.gradle.kts was not found in the extracted archive."
              find /tmp/mili-source -maxdepth 4 -type f | head -100
              exit 1
            fi
          else
            PROJECT_ROOT="/tmp/mili-source"
          fi

          rsync -a --delete --exclude='.github/' "$PROJECT_ROOT"/ ./
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
          echo "Project source extracted successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mili-Browser-GeckoView-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
