
name: Mili Browser Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Mili Browser APK 0.4.2
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract source archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$(find . -maxdepth 4 -type f -name "MiliBrowser-Source-0.4.2-Telegram-Complete.zip" -print -quit)"

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: Source ZIP not found."
            find . -maxdepth 4 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Using archive: $ARCHIVE"

          mkdir -p /tmp/mili-source
          unzip -q "$ARCHIVE" -d /tmp/mili-source

          PROJECT_DIR="$(find /tmp/mili-source -type f -name "settings.gradle.kts" -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"

          find "$PROJECT_DIR" -mindepth 1 -maxdepth 1 ! -name ".github" -exec cp -a {} "$GITHUB_WORKSPACE"/ \;

          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail

          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Fix legacy Kotlin activity labels
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/linkpilot/browser/LegacyMainActivity.kt"

          if [ -f "$FILE" ]; then
            sed -i 's/this@MainActivity/this@LegacyMainActivity/g' "$FILE"
          fi

      - name: Fix Mili Shield GeckoView nullable callbacks
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/milichrome/browser/core/browser/MiliShieldController.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: MiliShieldController.kt not found."
            exit 1
          fi

          cat > "$FILE" <<'KOTLIN'
          package com.milichrome.browser.core.browser

          import android.content.Context
          import android.util.Log
          import org.json.JSONObject
          import org.mozilla.geckoview.GeckoRuntime
          import org.mozilla.geckoview.WebExtension
          import java.util.concurrent.atomic.AtomicBoolean

          /** Installs Mili Shield and keeps a native messaging channel to its request filter. */
          class MiliShieldController(context: Context, private val runtime: GeckoRuntime) {
              private val installed = AtomicBoolean(false)
              @Volatile private var extension: WebExtension? = null
              @Volatile private var port: WebExtension.Port? = null

              @Volatile
              var lastStats: JSONObject = JSONObject()
                  private set

              private val pending = mutableListOf<JSONObject>()

              fun install(onReady: ((Boolean, String?) -> Unit)? = null) {
                  if (installed.get()) {
                      onReady?.invoke(true, null)
                      return
                  }

                  runtime.webExtensionController.ensureBuiltIn(
                      "resource://android/assets/extensions/mili-shield/",
                      "mili-shield@milichrome.local"
                  ).accept({ ext ->
                      val installedExtension = ext

                      if (installedExtension == null) {
                          val message = "GeckoView returned an empty Mili Shield extension."
                          Log.e("MiliShield", message)
                          onReady?.invoke(false, message)
                      } else {
                          runtime.webExtensionController
                              .setAllowedInPrivateBrowsing(installedExtension, true)
                              .accept({ privateReady ->
                                  attachExtension(
                                      privateReady ?: installedExtension,
                                      onReady
                                  )
                              }, { privateError ->
                                  Log.w(
                                      "MiliShield",
                                      "Private browsing permission could not be applied",
                                      privateError
                                  )
                                  attachExtension(installedExtension, onReady)
                              })
                      }
                  }, { error ->
                      val message = error?.message
                          ?: "Unknown error while installing Mili Shield."

                      Log.e(
                          "MiliShield",
                          "Could not install built-in Shield: $message",
                          error
                      )

                      onReady?.invoke(false, message)
                  })
              }

              private fun attachExtension(
                  ext: WebExtension,
                  onReady: ((Boolean, String?) -> Unit)?
              ) {
                  extension = ext

                  ext.setMessageDelegate(object : WebExtension.MessageDelegate {
                      override fun onConnect(port: WebExtension.Port) {
                          this@MiliShieldController.port = port

                          port.setDelegate(object : WebExtension.PortDelegate {
                              override fun onPortMessage(
                                  message: Any,
                                  port: WebExtension.Port
                              ) {
                                  if (
                                      message is JSONObject &&
                                      message.optString("type") == "mili:stats"
                                  ) {
                                      lastStats = message
                                  }

                                  Log.d("MiliShield", "Extension event: $message")
                              }

                              override fun onDisconnect(port: WebExtension.Port) {
                                  if (this@MiliShieldController.port === port) {
                                      this@MiliShieldController.port = null
                                  }
                              }
                          })

                          synchronized(pending) {
                              pending.forEach { port.postMessage(it) }
                              pending.clear()
                          }
                      }
                  }, "mili")

                  installed.set(true)
                  onReady?.invoke(true, null)
              }

              fun requestStats() =
                  sendMessage(JSONObject().put("type", "mili:get-stats"))

              private fun sendMessage(payload: JSONObject) {
                  val activePort = port

                  if (activePort != null) {
                      runCatching { activePort.postMessage(payload) }
                  } else {
                      synchronized(pending) {
                          pending.add(payload)
                      }
                  }
              }

              fun pushSettings(
                  global: JSONObject,
                  site: JSONObject?,
                  host: String?,
                  blockedHosts: Set<String>,
                  imageMode: Int,
                  blockPopups: Boolean
              ) {
                  val payload = JSONObject().apply {
                      put("type", "mili:configure")
                      put("global", global)
                      put("site", site ?: JSONObject())
                      put("host", host ?: "")
                      put("blockedHosts", org.json.JSONArray(blockedHosts.toList()))
                      put("imageMode", imageMode)
                      put("blockPopups", blockPopups)
                  }

                  sendMessage(payload)
              }
          }
          KOTLIN

          echo "MiliShieldController.kt updated."

      - name: Fix Kotlin compiler options
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          content = path.read_text()

          old = 'kotlinOptions { jvmTarget = "17" }'
          new = '''kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }'''

          count = content.count(old)

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one old Kotlin jvmTarget setting, found {count}"
              )

          content = content.replace(old, new, 1)
          path.write_text(content)

          print("Kotlin compiler options updated successfully.")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -type f -name "*.apk" -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mili-Browser-0.4.2-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
