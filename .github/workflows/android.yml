
name: Mili Browser Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Mili Browser APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract source archive
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/mili-source

          ARCHIVE=$(find . -maxdepth 3 -type f \( \
            -name "Mili-Browser-Source.zip" -o \
            -name "Mili-Browser-Full-Build-Kit.zip" -o \
            -name "Mili-Browser-GeckoView-foundation.zip" \
          \) | head -n 1)

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: Mili Browser source ZIP was not found."
            exit 1
          fi

          echo "Using archive: $ARCHIVE"
          unzip -q "$ARCHIVE" -d /tmp/mili-source

          # Extract an embedded source archive if one exists.
          INNER=$(find /tmp/mili-source -type f \
            -name "Mili-Browser-Source.zip" | head -n 1)

          if [ -n "$INNER" ]; then
            mkdir -p /tmp/mili-inner
            unzip -q "$INNER" -d /tmp/mili-inner
            cp -a /tmp/mili-inner/. /tmp/mili-source/
          fi

          PROJECT_DIR=$(find /tmp/mili-source -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found in ZIP."
            find /tmp/mili-source -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip \
              -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
            echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"
          else
            chmod +x gradlew
          fi

      - name: Fix Kotlin activity labels
        shell: bash
        run: |
          FILE="app/src/main/java/com/linkpilot/browser/LegacyMainActivity.kt"

          if [ -f "$FILE" ]; then
            sed -i \
              's/this@MainActivity/this@LegacyMainActivity/g' \
              "$FILE"
          else
            echo "ERROR: LegacyMainActivity.kt was not found."
            exit 1
          fi

          if grep -n 'this@MainActivity' "$FILE"; then
            echo "ERROR: Incorrect activity labels remain."
            exit 1
          fi

          echo "Kotlin activity labels checked."

      - name: Build debug APK
        shell: bash
        run: |
          if [ -f gradlew ]; then
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "APK generated successfully: $APK"
          ls -lh "$APK"

      - name: Upload Mili Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: Mili-Browser-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
